[project]
name = "sample_repository"
version = "1.0.0"
description = "Sample Repository"
packages = []
authors = []
dependencies = [
    "json5",
    "oarepo[s3,rdm]>=13.0.2,<14.0.0",
    "oarepo-runtime>=2.0.0dev0,<3.0.0",
    "oarepo-ui>=6.0.0dev0,<7.0.0",
    "oarepo-model>=0.1.0dev0,<1.0.0",
    "oarepo-rdm>=1.0.0dev0,<2.0.0",
    "python-dotenv",
    "marshmallow-i18n-messages",
#    "oarepo-communities==5.*",
#    "oarepo-dashboard==1.*",
#    "oarepo-doi==1.*",
     "oarepo-glitchtip==1.*",
#    "oarepo-global-search==1.*",
#    "oarepo-requests==2.*",
#    "oarepo-vocabularies==2.*",
#    "oarepo-workflows==1.*",
]
requires-python = ">=3.13,<3.14"

[project.entry-points."invenio_assets.webpack"]
branding = "ui.branding.webpack:theme"
i18n = "i18n.webpack:theme"
components = "ui.components.webpack:theme"
datasets = "ui.datasets.webpack:theme"

[project.entry-points."invenio_base.blueprints"]
branding = "ui.branding:create_blueprint"
titlepage = "ui.titlepage:create_blueprint"
components = "ui.components:create_blueprint"
datasets = "ui.datasets:create_blueprint"
invenio_app_rdm_users = "invenio_app_rdm.users_ui.views:create_ui_blueprint"
invenio_app_rdm_communities = "invenio_app_rdm.communities_ui.views:create_ui_blueprint"

[project.entry-points."invenio_base.api_blueprints"]
invenio_rdm_community_records = "invenio_rdm_records.views:create_community_records_bp"


[project.entry-points."invenio_i18n.translations"]
translations = "i18n"

[project.entry-points."invenio_db.alembic"]
repository = "common:alembic"

[project.entry-points."invenio_base.finalize_app"]
datasets_init_menu = "ui.datasets:init_menu"
rdm_init_menu = "invenio_app_rdm.ext:init_menu"

[tool.uv.build-backend]
module-root = ""
module-name = ["datasets", "common", "i18n", "ui"]

[build-system]
requires = ["uv_build>=0.8.7,<0.9.0"]
build-backend = "uv_build"